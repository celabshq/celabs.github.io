<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Post-Quantum HPKE demo — CE Labs</title><link rel=preload href=/fonts/source-serif-4-latin-opsz-normal.woff2 as=font type=font/woff2 crossorigin><link rel=preload href=/fonts/source-sans-3-latin-wght-normal.woff2 as=font type=font/woff2 crossorigin><link rel=stylesheet href=/css/main.ba12d6b0424a21389d5662ea2537511978783c90d51763d7abc7b38d575f865d.css integrity="sha256-uhLWsEJKITidVmLqJTdRGXh4PJDVF2PXq8ezjVdfhl0="></head><body class=embed><script type=module>
  function hex_to_bytes(hex) {
    var typedArray = new Uint8Array(
      hex.match(/[\da-f]{2}/gi).map(function (h) {
        return parseInt(h, 16);
      }),
    );
    return typedArray;
  }

  function bytes_to_hex(bytes) {
    return Array.from(bytes, function (byte) {
      return ("0" + (byte & 0xff).toString(16)).slice(-2);
    }).join("");
  }

  import init, {
    HpkeConfig,
    hpke_key_gen,
    hpke_seal,
    hpke_open,
  } from "./hpke_rs_wasm.js";

  await init();

  
  
  let config;

  function update_config() {
    const suite = document.getElementById("suite");
    const [mode, kem, kdf, aead] = suite.value.split(",").map(Number);
    
    
    config?.free();
    config = new HpkeConfig(mode, kem, kdf, aead);

    
    document.receiver_form.enc.value = "";
    document.receiver_form.ct.value = "";
    document.receiver_form.payload.value = "";
    document.receiver_form.pkR.value = "";
    document.receiver_form.skR.value = "";
  }
  document.getElementById("suite").onchange = update_config;
  update_config();

  function seal() {
    let info = new TextEncoder().encode(document.sender_form.info.value);
    let aad = new TextEncoder().encode(document.sender_form.aad.value);
    let pt = new TextEncoder().encode(document.sender_form.payload.value);
    let pkR = hex_to_bytes(document.receiver_form.pkR.value);

    let result = hpke_seal(config, pkR, info, aad, pt);
    let enc = result.enc;
    let ct = result.ct;

    document.receiver_form.enc.value = bytes_to_hex(enc);
    document.receiver_form.ct.value = bytes_to_hex(ct);
  }
  document.getElementById("hpke_seal").onclick = seal;

  function open() {
    try {
      let skR = hex_to_bytes(document.receiver_form.skR.value);
      let enc = hex_to_bytes(document.receiver_form.enc.value);
      let ct = hex_to_bytes(document.receiver_form.ct.value);
      let info = new TextEncoder().encode(document.sender_form.info.value);
      let aad = new TextEncoder().encode(document.sender_form.aad.value);

      let ptR = hpke_open(config, enc, skR, info, aad, ct);
      let ptR_string = new TextDecoder().decode(ptR);
      document.receiver_form.payload.value = ptR_string;
      document.receiver_form.payload.classList.remove("is-error");
    } catch {
      document.receiver_form.payload.value = " ⚠️  Error";
      document.receiver_form.payload.classList.add("is-error");
    }
  }
  document.getElementById("hpke_open").onclick = open;

  function gen_receiver_kp() {
    const kp = hpke_key_gen(config);

    let skR = kp.sk;
    let pkR = kp.pk;
    document.receiver_form.pkR.value = bytes_to_hex(pkR);
    document.receiver_form.skR.value = bytes_to_hex(skR);
  }
  document.getElementById("gen_receiver_kp").onclick = gen_receiver_kp;
</script><div class=demo><div class=demo__panel><h3 class=demo__title>Sender</h3><p class=demo__note>Encrypts the payload to the receiver's public key.</p><form name=sender_form onsubmit="return hpke_seal(),!1"><label for=info>Info</label>
<input name=info id=info>
<label for=aad>Additional data</label>
<input name=aad id=aad>
<label for=payload>Payload</label>
<textarea name=payload id=payload placeholder="The payload…"></textarea>
<button type=button id=hpke_seal class="btn btn--solid">Seal</button></form></div><div class=demo__panel><h3 class=demo__title>Receiver</h3><p class=demo__note>Generates a key pair and recovers the payload.</p><form name=receiver_form onsubmit=return!1><label for=suite>Ciphersuite</label>
<select name=suite id=suite><option value=0,32,1,3 selected>DHKEM(X25519, HKDF-SHA256) · HKDF-SHA256 · ChaCha20Poly1305</option><option value=0,32,1,1>DHKEM(X25519, HKDF-SHA256) · HKDF-SHA256 · AES-128-GCM</option><option value=0,16,1,1>DHKEM(P-256, HKDF-SHA256) · HKDF-SHA256 · AES-128-GCM</option><option value=0,25722,17,3>ML-KEM-768 + X25519 · SHAKE256 · ChaCha20Poly1305</option><option value=0,65,1,3>ML-KEM-768 · HKDF-SHA256 · ChaCha20Poly1305</option><option value=0,80,17,2>ML-KEM-768 + P-256 · SHAKE256 · AES-256-GCM</option></select>
<button type=button id=gen_receiver_kp class="btn btn--solid">Generate key pair</button>
<label for=pkR>Public key (pk)</label>
<input name=pkR id=pkR>
<label for=skR>Private key (sk)</label>
<input name=skR id=skR><hr><label for=enc>Encapsulated key (enc)</label>
<input name=enc id=enc>
<label for=ct>Ciphertext (ct)</label>
<input name=ct id=sct>
<button type=button id=hpke_open class="btn btn--outline">Open</button>
<label for=payload>Decrypted payload</label>
<textarea name=payload id=payload placeholder="The decrypted payload…" readonly></textarea></form></div></div></body></html>
