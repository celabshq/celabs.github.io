<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A two-dimensional point lattice: its basis is repeatedly reduced from a long, skewed pair of vectors to a short, near-orthogonal one, while a target point circles a cell and snaps to its nearest lattice point — a lattice cryptography motif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#D2912F"/>
    </marker>
  </defs>

  <!-- no canvas: drawn straight onto the page, like a figure in a paper -->

  <!--
    The lattice is L = { m*b1 + n*b2 }, origin (94,530), b1 = (82,-26), b2 = (30,-76).
    Everything below lives inside #plane, so the only motion applied to the point
    set as a whole is a rigid rotation plus a slight shear/scale: a linear map
    sends a lattice to a lattice, and because the mesh, the points, the basis
    arrows and the cell all sit in the same group, the points can never leave
    their grid lines. No point is ever animated off its own lattice site.
    Rotation is capped near 9deg: beyond that the corner point (706,70) swings
    outside the top of the viewBox.
  -->
  <g id="plane">
    <animateTransform attributeName="transform" type="rotate" repeatCount="indefinite"
      dur="24s" calcMode="spline" keyTimes="0;0.35;0.7;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
      values="-9 400 300;3 400 300;9 400 300;-9 400 300"/>
    <g transform="translate(400,300)">
      <g id="shear">
        <animateTransform attributeName="transform" type="skewX" repeatCount="indefinite"
          dur="17s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
          values="-2.5;2.5;-2.5"/>
        <g id="scaler">
          <animateTransform attributeName="transform" type="scale" repeatCount="indefinite"
            dur="21s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
            values="0.97;1.03;0.97"/>
          <g transform="translate(-400,-300)">

            <!-- lattice mesh: faint lines along the two basis directions -->
            <g id="mesh" stroke="#16607A" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round">
              <animate attributeName="opacity" values="0.2;0.38;0.2" dur="19s" repeatCount="indefinite"/>
              <polyline points="94,530 124,454 154,378 184,302 214,226"/>
              <polyline points="176,504 206,428 236,352 266,276 296,200"/>
              <polyline points="258,478 288,402 318,326 348,250 378,174"/>
              <polyline points="340,452 370,376 400,300 430,224 460,148"/>
              <polyline points="422,426 452,350 482,274 512,198 542,122"/>
              <polyline points="504,400 534,324 564,248 594,172 624,96"/>
              <polyline points="586,374 616,298 646,222 676,146 706,70"/>
              <polyline points="94,530 176,504 258,478 340,452 422,426 504,400 586,374"/>
              <polyline points="124,454 206,428 288,402 370,376 452,350 534,324 616,298"/>
              <polyline points="154,378 236,352 318,326 400,300 482,274 564,248 646,222"/>
              <polyline points="184,302 266,276 348,250 430,224 512,198 594,172 676,146"/>
              <polyline points="214,226 296,200 378,174 460,148 542,122 624,96 706,70"/>
            </g>

            <!--
              Fundamental parallelogram, following the basis through the reduction
              below. Its corners are always O, O+b1, O+b1+b2, O+b2 for the current
              basis; since every step is unimodular its AREA never changes — the
              covolume of the lattice is a basis-independent invariant.
            -->
            <polygon points="94,530 400,300 594,172 288,402" fill="#D2912F" opacity="0.12">
              <animate attributeName="points" dur="26s" repeatCount="indefinite"
                keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
                values="94,530 400,300 594,172 288,402;94,530 400,300 594,172 288,402;94,530 206,428 400,300 288,402;94,530 206,428 400,300 288,402;94,530 206,428 288,402 176,504;94,530 206,428 288,402 176,504;94,530 124,454 206,428 176,504;94,530 124,454 206,428 176,504;94,530 206,428 288,402 176,504;94,530 206,428 288,402 176,504;94,530 206,428 400,300 288,402;94,530 206,428 400,300 288,402;94,530 400,300 594,172 288,402;94,530 400,300 594,172 288,402"/>
            </polygon>

            <!-- lattice points: fixed at their sites, the whole field breathing -->
            <g fill="#51677A" opacity="0.9">
              <animate attributeName="opacity" values="0.62;1;0.62" dur="11s" repeatCount="indefinite"/>
              <circle cx="206" cy="428" r="3.4"/><circle cx="236" cy="352" r="3.4"/><circle cx="266" cy="276" r="3.4"/>
              <circle cx="288" cy="402" r="3.4"/><circle cx="318" cy="326" r="3.4"/><circle cx="348" cy="250" r="3.4"/>
              <circle cx="340" cy="452" r="3.4"/><circle cx="370" cy="376" r="3.4"/><circle cx="430" cy="224" r="3.4"/><circle cx="460" cy="148" r="3.4"/>
              <circle cx="534" cy="324" r="3.4"/><circle cx="594" cy="172" r="3.4"/>
              <circle cx="616" cy="298" r="3.4"/><circle cx="676" cy="146" r="3.4"/>
            </g>

            <!-- center lattice point, a subtle amber accent -->
            <circle cx="400" cy="300" r="4" fill="#D2912F" opacity="0.8">
              <animate attributeName="r" values="3.4;5.4;3.4" dur="7s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.5;0.95;0.5" dur="7s" repeatCount="indefinite"/>
            </circle>

            <!-- the same lattice points, very subtly warmed to trace a (sheared) CE.
                 Counterphase with the field above, so the CE surfaces and recedes. -->
            <g fill="#9E631A" opacity="0.85">
              <animate attributeName="opacity" values="1;0.55;1" dur="11s" begin="-3.7s" repeatCount="indefinite"/>
              <!-- C: top bar, left side, bottom bar (origin completes the lower-left corner) -->
              <circle cx="214" cy="226" r="3.4"/><circle cx="296" cy="200" r="3.4"/><circle cx="378" cy="174" r="3.4"/>
              <circle cx="124" cy="454" r="3.4"/><circle cx="154" cy="378" r="3.4"/><circle cx="184" cy="302" r="3.4"/>
              <circle cx="176" cy="504" r="3.4"/><circle cx="258" cy="478" r="3.4"/>
              <!-- E: left spine -->
              <circle cx="422" cy="426" r="3.4"/><circle cx="452" cy="350" r="3.4"/><circle cx="482" cy="274" r="3.4"/><circle cx="512" cy="198" r="3.4"/><circle cx="542" cy="122" r="3.4"/>
              <!-- E: bottom, middle, top bars -->
              <circle cx="504" cy="400" r="3.4"/><circle cx="564" cy="248" r="3.4"/><circle cx="624" cy="96" r="3.4"/>
              <circle cx="586" cy="374" r="3.4"/><circle cx="646" cy="222" r="3.4"/><circle cx="706" cy="70" r="3.4"/>
            </g>

            <!--
              The closest-vector picture. A target that is NOT on the lattice
              circles one cell (an ellipse inscribed in the cell, so it stays put
              between four sites), and the dashed link + ring jump discretely to
              whichever of the four corners is nearest. Continuous target, discrete
              answer: the shape of CVP/BDD, and of decoding LWE noise.
              Path samples are O + (0.5 + 0.42cos t)*b1 + (0.5 + 0.42sin t)*b2
              around the cell at (400,300); nearest corner cycles C,C,D,D,A,A,B,B.
            -->
            <g id="cvp">
              <line x1="493" y1="227" x2="512" y2="198" stroke="#51677A" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7">
                <animate attributeName="x1" dur="16s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="493;481;454;429;419;431;458;483;493"/>
                <animate attributeName="y1" dur="16s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="227;215;224;247;271;283;274;251;227"/>
                <animate attributeName="x2" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="512;512;430;430;400;400;482;482;512"/>
                <animate attributeName="y2" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="198;198;224;224;300;300;274;274;198"/>
              </line>
              <circle cx="512" cy="198" r="8" fill="none" stroke="#D2912F" stroke-width="1.4" opacity="0.75">
                <animate attributeName="cx" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="512;512;430;430;400;400;482;482;512"/>
                <animate attributeName="cy" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="198;198;224;224;300;300;274;274;198"/>
                <animate attributeName="r" values="7;9.5;7" dur="4s" repeatCount="indefinite"/>
              </circle>
              <circle cx="493" cy="227" r="2.6" fill="#0E2436">
                <animate attributeName="cx" dur="16s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="493;481;454;429;419;431;458;483;493"/>
                <animate attributeName="cy" dur="16s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="227;215;224;247;271;283;274;251;227"/>
              </circle>
            </g>

            <!--
              Basis vectors from the origin, stepping through Lagrange/Gauss
              reduction and back. Each step subtracts one basis vector from the
              other — an integer, determinant-1 change of basis — so all four
              bases generate exactly the SAME lattice and every arrow tip lands on
              a drawn lattice point. This is the "bad basis vs good basis" that
              lattice cryptography is built on: the public, badly-skewed basis and
              the short secret one describe the same point set.
                S0  b1 = 3u+2v -> (400,300)   b2 = 2u+v -> (288,402)   long, near parallel
                S1  b1 =  u+ v  -> (206,428)   b2 = 2u+v -> (288,402)
                S2  b1 =  u+ v  -> (206,428)   b2 =    u  -> (176,504)
                S3  b1 =     v  -> (124,454)   b2 =    u  -> (176,504)  reduced
              Endpoints are pulled ~6px back along each vector so the arrowhead
              tip, not the line end, sits on the lattice point.
            -->
            <g stroke="#D2912F" stroke-width="2.4" fill="none" stroke-linecap="round">
              <line x1="94" y1="530" x2="395.2" y2="303.6" marker-end="url(#arrow)">
                <animate attributeName="x2" dur="26s" repeatCount="indefinite"
                  keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
                  values="395.2;395.2;201.6;201.6;201.6;201.6;121.8;121.8;201.6;201.6;201.6;201.6;395.2;395.2"/>
                <animate attributeName="y2" dur="26s" repeatCount="indefinite"
                  keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
                  values="303.6;303.6;432;432;432;432;459.6;459.6;432;432;432;432;303.6;303.6"/>
              </line>
              <line x1="94" y1="530" x2="283" y2="405.3" marker-end="url(#arrow)">
                <animate attributeName="x2" dur="26s" repeatCount="indefinite"
                  keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
                  values="283;283;283;283;170.3;170.3;170.3;170.3;170.3;170.3;283;283;283;283"/>
                <animate attributeName="y2" dur="26s" repeatCount="indefinite"
                  keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
                  values="405.3;405.3;405.3;405.3;505.8;505.8;505.8;505.8;505.8;505.8;405.3;405.3;405.3;405.3"/>
              </line>
            </g>
            <!-- origin (the one amber accent, also the C's lower-left corner) -->
            <circle cx="94" cy="530" r="4.5" fill="#D2912F"/>

          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
