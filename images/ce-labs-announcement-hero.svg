<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A beacon at the center sends rings broadcasting outward across a field of connected points — the launch of CE Labs.">
  <defs>
    <radialGradient id="ann-fade" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#0E2436" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E2436" stop-opacity="0.6"/>
    </radialGradient>
    <style>
      .ann-ring {
        transform-origin: 600px 200px;
        animation: ann-pulse 4s ease-out infinite;
      }
      .ann-ring:nth-child(2) { animation-delay: 1.3s; }
      .ann-ring:nth-child(3) { animation-delay: 2.6s; }
      @keyframes ann-pulse {
        0%   { transform: scale(0.3); opacity: 0.9; }
        100% { transform: scale(1); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ann-ring { animation: none; opacity: 0.35; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0E2436"/>

  <!-- audience: scattered connected points -->
  <g stroke="#2C4658" stroke-width="1.5" fill="none">
    <line x1="180" y1="90" x2="600" y2="200"/>
    <line x1="320" y1="320" x2="600" y2="200"/>
    <line x1="900" y1="80" x2="600" y2="200"/>
    <line x1="1040" y1="300" x2="600" y2="200"/>
    <line x1="150" y1="250" x2="600" y2="200"/>
    <line x1="1000" y1="150" x2="600" y2="200"/>
  </g>
  <g fill="#C7D4DF" opacity="0.7">
    <circle cx="180" cy="90" r="6"/>
    <circle cx="320" cy="320" r="6"/>
    <circle cx="900" cy="80" r="6"/>
    <circle cx="1040" cy="300" r="6"/>
    <circle cx="150" cy="250" r="6"/>
    <circle cx="1000" cy="150" r="6"/>
  </g>

  <!-- broadcast rings from the beacon -->
  <g fill="none" stroke="#D2912F" stroke-width="3">
    <circle class="ann-ring" cx="600" cy="200" r="60"/>
    <circle class="ann-ring" cx="600" cy="200" r="60"/>
    <circle class="ann-ring" cx="600" cy="200" r="60"/>
  </g>

  <!-- the beacon -->
  <circle cx="600" cy="200" r="22" fill="#D2912F"/>
  <circle cx="600" cy="200" r="10" fill="#0E2436"/>

  <rect width="1200" height="400" fill="url(#ann-fade)"/>
</svg>
