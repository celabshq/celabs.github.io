<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c2410c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c2d12;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#grad1)"/>

  <g fill="rgba(255,255,255,0.15)" filter="url(#glow)">
    <circle cx="150" cy="80" r="12"/>
    <circle cx="350" cy="120" r="12"/>
    <circle cx="600" cy="100" r="12"/>
    <circle cx="850" cy="150" r="12"/>
    <circle cx="1050" cy="90" r="12"/>

    <circle cx="200" cy="280" r="12"/>
    <circle cx="450" cy="320" r="12"/>
    <circle cx="750" cy="300" r="12"/>
    <circle cx="1000" cy="280" r="12"/>
  </g>

  <g stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none">
    <line x1="150" y1="80" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="600" y2="100"/>
    <line x1="600" y1="100" x2="850" y2="150"/>
    <line x1="850" y1="150" x2="1050" y2="90"/>

    <line x1="200" y1="280" x2="450" y2="320"/>
    <line x1="450" y1="320" x2="750" y2="300"/>
    <line x1="750" y1="300" x2="1000" y2="280"/>

    <line x1="150" y1="80" x2="200" y2="280"/>
    <line x1="600" y1="100" x2="450" y2="320"/>
    <line x1="850" y1="150" x2="750" y2="300"/>
  </g>

  <g fill="rgba(255,255,255,0.9)" filter="url(#glow)">
    <circle cx="600" cy="200" r="20"/>
  </g>

</svg>
